[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorenz-lab"
version = "0.1.0"
description = "Bounded Lorenz simulation with plots and reproducible exports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Makhan Azat"}]
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8"]

[project.scripts]
lorenz-lab = "lorenz_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
